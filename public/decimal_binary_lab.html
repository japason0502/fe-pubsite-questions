<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10進 ↔ 2進ラボ（0〜255）</title>
  <style>
    :root {
      --bg: #eef1f6;
      --surface: #ffffff;
      --surface-2: #f4f6fa;
      --border: #d8dde8;
      --text: #141826;
      --muted: #5c6478;
      --accent: #3d5a80;
      --accent-2: #5b7aa1;
      --accent-soft: rgba(61, 90, 128, 0.12);
      --ok: #2d6a4f;
      --row-h: 36px;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 2px 8px rgba(20, 24, 38, 0.06);
      --font: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      --mono: ui-monospace, "Cascadia Code", "Consolas", monospace;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 1.75rem);
      padding-bottom: clamp(5rem, 14vw, 6.5rem);
    }

    /* 表示モード: 10進まわりを隠す */
    body.view-hide-dec .view-part-dec,
    body.view-hide-dec .scroll-col--dec {
      display: none !important;
    }
    body.view-hide-dec .scroll-head,
    body.view-hide-dec .row {
      grid-template-columns: 1fr !important;
    }
    /* 表示モード: 2進まわりを隠す */
    body.view-hide-bin .view-part-bin,
    body.view-hide-bin .scroll-col--bin {
      display: none !important;
    }
    body.view-hide-bin .scroll-head,
    body.view-hide-bin .row {
      grid-template-columns: 1fr !important;
    }

    /* 2進/10進どちらかを隠すモードでは対応一覧は常に非表示 */
    body.view-hide-dec .view-part-list,
    body.view-hide-bin .view-part-list {
      display: none !important;
    }
    /* すべて表示モードで「対応一覧を表示」オフのとき */
    body.view-all.list-hidden .view-part-list {
      display: none !important;
    }

    body.hide-weights .bit-cell .w,
    body.hide-weights .bit-cell .bit-pow {
      display: none !important;
    }

    body.view-hide-dec .step-btns--dec {
      display: none !important;
    }
    body:not(.view-hide-dec) .step-btns--bin {
      display: none !important;
    }
    .num-side--dec-mul {
      display: none !important;
    }
    body.view-hide-bin .num-side--dec-mul {
      display: flex !important;
    }

    .view-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.55rem clamp(0.75rem, 3vw, 1.25rem);
      padding-bottom: calc(0.55rem + env(safe-area-inset-bottom, 0));
      background: var(--surface);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 20px rgba(20, 24, 38, 0.08);
    }
    .view-bar__row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.35rem 0.75rem;
      width: 100%;
    }
    .view-bar__list-label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      border-radius: 8px;
    }
    .view-bar__list--locked .view-bar__list-label--list {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .view-bar__list--locked .view-bar__list-label--list input {
      cursor: not-allowed;
    }
    .view-bar__row.view-bar__list {
      justify-content: space-between;
      gap: 0.75rem 1rem;
    }
    .view-bar__list-trailing {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.35rem 0.75rem;
      margin-left: auto;
    }
    .view-bar__title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-right: 0.25rem;
    }
    .view-bar__opts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.25rem 0.5rem;
    }
    .view-bar label {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 0.35rem 0.55rem;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .view-bar label:hover {
      background: var(--surface-2);
    }
    .view-bar input {
      accent-color: var(--accent);
      width: 1rem;
      height: 1rem;
    }
    .view-bar label.view-bar__active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .page-header {
      margin-bottom: 1.5rem;
    }
    .page-header h1 {
      font-size: clamp(1.15rem, 2.8vw, 1.45rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
      color: var(--text);
    }

    .wrap {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(1rem, 3vw, 1.35rem);
      align-items: start;
    }
    @media (min-width: 880px) {
      .wrap {
        grid-template-columns: minmax(280px, 1fr) minmax(260px, 380px);
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(0.85rem, 2.5vw, 1.15rem);
      box-shadow: var(--shadow);
    }
    .panel--list {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 0.65rem;
    }
    .section-title:not(:first-child) {
      margin-top: 1.35rem;
    }

    .readout-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.65rem;
    }
    .readout-head .section-title {
      margin-bottom: 0;
    }
    .readout-head__btns {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.35rem;
    }
    .btn-tool,
    .btn-reset {
      flex: 0 0 auto;
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 0.38rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn-tool:hover:not(:disabled) {
      border-color: var(--accent-2);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .btn-tool:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }
    .btn-reset:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .btn-reset:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }
    .answer-reveal {
      margin: 0 0 0.65rem;
      padding: 0.45rem 0.65rem;
      font-size: 0.88rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      text-align: center;
    }
    .answer-reveal[hidden] {
      display: none !important;
    }
    body.view-hide-bin .answer-reveal {
      font-family: var(--mono);
    }

    .readout {
      text-align: right;
    }
    @media (max-width: 600px) {
      .readout {
        text-align: center;
      }
      .num-row {
        justify-content: center !important;
      }
      .num-main {
        text-align: center !important;
      }
      .controls {
        justify-content: center !important;
      }
      .controls label {
        justify-content: center !important;
        flex-wrap: wrap;
      }
      .bin-jump-block {
        align-items: center !important;
      }
      .bin-jump-row {
        justify-content: center !important;
      }
      .bit-cells {
        justify-content: center !important;
      }
      .dec-jump-wrap {
        align-items: center !important;
      }
      .digit-cells {
        justify-content: center !important;
      }
      .readout-head {
        justify-content: center;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .divmod-equation {
        text-align: center;
      }
      .divmod-divisor-row {
        justify-content: center;
      }
      .divmod-shift-hint {
        margin-left: 0;
        flex: 1 1 100%;
        text-align: left;
      }
      .divmod-val {
        justify-content: center;
        text-align: center;
      }
      .divmod-grid-label {
        text-align: center;
        padding-right: 0;
      }
    }

    .readout .big {
      font-variant-numeric: tabular-nums;
    }
    .num-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 0.2rem;
      letter-spacing: 0.08em;
    }
    .num-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
    }
    .num-main {
      flex: 1 1 auto;
      min-width: 0;
      text-align: right;
    }
    .num-side {
      flex: 0 0 2.25rem;
      width: 2.25rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .num-side--readout-spacer {
      display: none;
    }
    body.view-all .num-row.view-part-dec .num-side--readout-spacer {
      display: flex;
      flex: 0 0 2.25rem;
      width: 2.25rem;
      visibility: hidden;
      pointer-events: none;
    }
    .readout .dec {
      font-size: clamp(1.85rem, 7vw, 2.6rem);
      font-weight: 700;
      line-height: 1.1;
      margin: 0;
      color: var(--text);
    }
    .readout .bin {
      font-family: var(--mono);
      font-size: clamp(1.5rem, 5.5vw, 2.45rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      word-break: break-all;
      line-height: 1.15;
      color: var(--accent);
    }
    .step-btns {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .step-btns button {
      width: 2.25rem;
      height: 1.4rem;
      min-height: 36px;
      padding: 0;
      font-size: 0.68rem;
      line-height: 1;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .step-btns button:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .step-btns button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .step-btns--bin-mul button,
    .step-btns--dec-mul button {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: flex-end;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .controls label {
      font-size: 0.86rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.4rem;
      color: var(--text);
    }
    .controls input[type="number"] {
      width: 4.75rem;
      max-width: 100%;
      padding: 0.4rem 0.45rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
    }
    .controls input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .controls--first {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    .bin-jump-block {
      flex-direction: column;
      align-items: flex-end;
      gap: 0.65rem;
      width: 100%;
      border-top: none;
      margin-top: 0;
      padding-top: 0;
    }
    .bin-jump-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: flex-end;
      width: 100%;
    }
    .bit-cells {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 0.4rem;
      width: 100%;
    }
    @media (max-width: 520px) {
      .bit-cells {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.55rem 0.35rem;
        justify-items: center;
      }
    }
    .bit-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
    }
    .bit-step {
      width: 2rem;
      min-height: 32px;
      height: 1.25rem;
      padding: 0;
      font-size: 0.6rem;
      line-height: 1;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .bit-step:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .bit-step:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .bit-pow {
      font-size: 0.62rem;
      line-height: 1.35;
      color: var(--muted);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-align: center;
      max-width: 3.8rem;
      letter-spacing: -0.02em;
    }
    .bit-pow sup {
      font-size: 0.65em;
      font-weight: 600;
      line-height: 0;
      position: relative;
      top: -0.4em;
      color: inherit;
    }
    .bit-cell .w {
      font-size: 0.62rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .bit-in {
      width: 2rem;
      min-width: 44px;
      min-height: 44px;
      height: 2rem;
      padding: 0;
      text-align: center;
      font-size: 1.05rem;
      font-family: var(--mono);
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
    }
    /* 2進ジャンプ: 0=OFF 暗く / 1=ON 黄み */
    .bit-cell--off .bit-in {
      background: #dfe2ea;
      color: #5c6478;
      border-color: #b8becd;
    }
    .bit-cell--off .bit-in:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .bit-cell--on .bit-in {
      background: linear-gradient(180deg, #fff8e1 0%, #ffecb3 100%);
      color: #6d4c00;
      border-color: #d4a832;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }
    .bit-cell--on .bit-in:focus {
      outline: none;
      border-color: #b8860b;
      box-shadow: 0 0 0 3px rgba(212, 168, 50, 0.28);
    }
    .controls.dec-jump-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.65rem;
      width: 100%;
    }
    .digit-cells {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.5rem;
      width: 100%;
    }
    @media (max-width: 400px) {
      .digit-cells {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        justify-items: center;
      }
    }
    .list-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .list-heading h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }
    .list-heading span {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .scroll-panel {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .scroll-head {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 0.5rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 0.4rem 0.6rem;
      background: var(--surface-2);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
    }
    .scroll-head span:last-child {
      text-align: right;
      font-family: var(--mono);
    }
    #scroller {
      height: min(52vh, 400px);
      min-height: 200px;
      overflow: auto;
      scroll-snap-type: y mandatory;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      -webkit-overflow-scrolling: touch;
    }
    @media (min-width: 880px) {
      #scroller {
        height: min(60vh, 440px);
      }
    }
    .row {
      height: var(--row-h);
      scroll-snap-align: center;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 0.5rem;
      align-items: center;
      padding: 0 0.6rem;
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
      border-bottom: 1px solid #e8ebf2;
      cursor: pointer;
      transition: background 0.12s;
    }
    .row:hover {
      background: var(--surface-2);
    }
    .row .d { text-align: right; font-weight: 500; }
    .row .b {
      font-family: var(--mono);
      text-align: right;
      font-size: 0.74rem;
      letter-spacing: -0.02em;
      color: var(--muted);
    }
    .row.active {
      background: var(--accent-soft);
      font-weight: 600;
    }
    .row.active .b {
      color: var(--text);
    }

    /* 割り算（商・余り） */
    .divmod-panel {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .divmod-panel[hidden] {
      display: none !important;
    }
    .divmod-divisor-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
      margin-bottom: 0.65rem;
      font-size: 0.82rem;
    }
    .divmod-shift-hint {
      flex: 1 1 auto;
      min-width: 0;
      margin-left: 0.5rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.35;
      text-align: left;
    }
    .divmod-shift-hint-num {
      display: inline-block;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.12em 0.4em 0.15em;
      border-radius: 6px;
      line-height: 1.2;
      vertical-align: baseline;
    }
    .divmod-divisor {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
      color: var(--text);
    }
    .divmod-divisor-op {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .divmod-divisor select {
      min-width: 4.25rem;
      padding: 0.35rem 1.75rem 0.35rem 0.4rem;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .divmod-divisor select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .divmod-equation {
      margin: 0 0 0.65rem;
      font-size: 0.92rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--muted);
      line-height: 1.45;
    }
    .divmod-align-row {
      margin-bottom: 0;
      align-items: stretch;
    }
    .divmod-align-side {
      visibility: hidden;
      pointer-events: none;
    }
    .divmod-grid {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      font-size: 0.88rem;
      width: 100%;
    }
    .divmod-grid-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr);
      gap: 0.35rem 0.5rem;
      align-items: stretch;
    }
    .divmod-head-cell {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding-bottom: 0.05rem;
      text-align: center;
    }
    .divmod-grid-corner,
    .divmod-grid-label {
      min-width: 2.75rem;
      box-sizing: border-box;
    }
    .divmod-grid-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text);
      text-align: right;
      padding-right: 0.25rem;
    }
    .divmod-val {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.05rem, 3.6vw, 1.35rem);
      text-align: right;
      padding: 0.4rem 0.55rem;
      min-height: 2.85rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      box-sizing: border-box;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--border);
      line-height: 1.2;
      word-break: break-all;
    }
    .divmod-val.dec { font-family: inherit; color: var(--text); }
    .divmod-val.bin { font-family: var(--mono); color: var(--accent); }
    body.view-hide-dec .divmod-row--dec { display: none !important; }
    body.view-hide-bin .divmod-row--bin { display: none !important; }

    /* 論理演算モード（2進数のみ） */
    .logic-op-panel {
      display: none;
      margin-top: 0.8rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
    }
    body.view-hide-dec.logic-mode-on .logic-op-panel {
      display: block;
    }
    body.view-hide-dec.logic-mode-on .readout-head,
    body.view-hide-dec.logic-mode-on .answer-reveal,
    body.view-hide-dec.logic-mode-on .num-row,
    body.view-hide-dec.logic-mode-on .divmod-panel,
    body.view-hide-dec.logic-mode-on .section-title.view-part-bin,
body.view-hide-dec.logic-mode-on .controls.bin-jump-block.view-part-bin {
      display: none !important;
    }
    .logic-op-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.45rem 0.8rem;
      margin-bottom: 0.6rem;
    }
    .logic-op-types {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.6rem;
    }
    .logic-op-types[hidden] {
      display: none !important;
    }
    .logic-op-types label {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      padding: 0.2rem 0.35rem;
      border-radius: 999px;
    }
    .logic-op-types input {
      accent-color: var(--accent);
      width: 1rem;
      height: 1rem;
    }
    .logic-row {
      margin: 0.65rem 0 0;
      display: grid;
      grid-template-columns: 3.2rem minmax(0, 1fr);
      align-items: start;
      gap: 0.35rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.45rem 0.55rem 0.55rem;
      background: var(--surface-2);
    }
    .logic-row[hidden] {
      display: none !important;
    }
    .logic-row .num-label {
      margin: 0;
      text-align: center;
      white-space: nowrap;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.08rem 0.55rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      align-self: center;
      justify-self: center;
    }
    .logic-row .bit-cells {
      justify-content: flex-end;
    }
    .logic-row .bit-cell {
      gap: 0.1rem;
    }
    .logic-op-panel .logic-bit-step {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      font-size: 0.62rem;
      font-weight: 600;
      line-height: 1;
      background: #f0f3f8;
      color: #6e7688;
      border-color: #cdd4e2;
    }
    .logic-op-panel .logic-bit-step:hover:not(:disabled) {
      background: #e9edf5;
      color: #5c6478;
      border-color: #bcc5d6;
    }
    .logic-op-panel .logic-bit-spacer {
      width: 2rem;
      min-height: 36px;
      height: 1.4rem;
      visibility: hidden;
      pointer-events: none;
    }
    .logic-row--result {
      border-color: #d4a832;
      background: linear-gradient(180deg, #fffdf5 0%, #fff8e6 100%);
    }
    .logic-row--result .num-label {
      border-color: #d4a832;
      background: rgba(212, 168, 50, 0.14);
      color: #7a5a00;
    }
    .logic-answer-wrap {
      margin-top: 0.55rem;
      display: flex;
      justify-content: center;
    }
    .logic-answer-wrap--inline {
      margin-top: 0;
      justify-content: flex-end;
      width: 100%;
    }
    .logic-answer-wrap[hidden] {
      display: none !important;
    }
    @media (max-width: 600px) {
      .logic-op-head {
        justify-content: center;
      }
      .logic-row {
        grid-template-columns: 1fr;
        gap: 0.25rem;
      }
      .logic-row .num-label {
        text-align: center;
        margin-top: 0;
        justify-self: center;
      }
      .logic-row .bit-cells {
        justify-content: center;
      }
    }
  </style>
</head>
<body class="view-all">
  <div class="page">
    <header class="page-header">
      <h1>10進 ↔ 2進ラボ</h1>

    <div class="wrap">

                <input type="radio" name="logicOpType" id="logicOpOr" value="or" checked>
                論理和（OR）
              </label>
              <label>
                <input type="radio" name="logicOpType" id="logicOpAnd" value="and">
                論理積（AND）
              </label>
              <button type="button" class="btn-tool" id="btnLogicRandom" aria-label="論理演算用の条件付きランダム">ランダム</button>
            </div>
            <div class="logic-answer-wrap logic-answer-wrap--inline" id="logicAnswerWrapTop" hidden>
              <button type="button" class="btn-tool" id="btnLogicRevealTop" aria-label="隠れている内容を表示">答えを見る</button>
            </div>
          </div>
          <div class="logic-row logic-row--a">
            <span class="num-label">A</span>

              <div class="bin-jump-row">

        <div class="num-row view-part-bin">
          <div class="num-main">

          <div class="num-side">

              <button type="button" id="binMul2" aria-label="2倍（左シフト）">×2</button>
              <button type="button" id="binDiv2" aria-label="半分（右シフト・切り捨て）">÷2</button>
            </div>
          </div>
          <div class="num-side">
            <div class="step-btns step-btns--bin">
              <button type="button" id="stepUpBin" aria-label="1増やす">▲</button>
              <button type="button" id="stepDownBin" aria-label="1減らす">▼</button>

        <div class="divmod-panel" id="divmodSection" hidden>
          <p class="section-title">割り算（被除数＝上の数）</p>
          <div class="divmod-divisor-row">
            <label class="divmod-divisor">
              <span class="divmod-divisor-op" aria-hidden="true">÷</span>
              <select id="divisorInput" aria-label="除数"></select>
            </label>
            <span class="divmod-shift-hint" id="divmodShiftHint"></span>

          <div class="divmod-results" id="divmodResults">
            <div class="num-row divmod-align-row">
              <div class="num-main">
                <p class="divmod-equation" id="divmodEquation"></p>
                <div class="divmod-grid" id="divmodGrid" aria-label="商と余り">
                  <div class="divmod-grid-row divmod-grid-row--head">
                    <span class="divmod-grid-corner" aria-hidden="true"></span>

                  <div class="divmod-grid-row divmod-row--dec view-part-dec">
                    <span class="divmod-grid-label">10進</span>
                    <span class="divmod-val dec" id="outQuotDec">0</span>
                    <span class="divmod-val dec" id="outRemDec">0</span>

        <div class="controls controls--first dec-jump-wrap view-part-dec">

            <div class="digit-cells" id="decCells" aria-label="10進3桁"></div>
          </div>

        <p class="section-title view-part-bin">ジャンプ（2進・8 ビット）</p>
        <div class="controls bin-jump-block view-part-bin">

      <div class="panel panel--list view-part-list">

          <span>タップ／クリックでもジャンプ</span>
        </div>
        <div class="scroll-panel">
          <div class="scroll-head"><span class="scroll-col scroll-col--dec">10進</span><span class="scroll-col scroll-col--bin">2進</span></div>
          <div id="scroller"></div>

  <footer class="view-bar" role="toolbar" aria-label="表示の切り替え">
    <div class="view-bar__row">

          <input type="radio" name="viewMode" value="hide-bin">
          10進数のみ
        </label>
        <label>
          <input type="radio" name="viewMode" value="hide-dec">
          2進数のみ
        </label>

          <input type="radio" name="viewMode" value="logic">

    <div class="view-bar__row view-bar__list" id="listToggleWrap">

          <span>商と余りを表示</span>
        </label>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      const ROW_H = 36;
      const MIN = 0;
      const MAX = 255;
      const DEC_WEIGHTS = [100, 10, 1];
      const WEIGHTS = [128, 64, 32, 16, 8, 4, 2, 1];
      const scroller = document.getElementById("scroller");
      const decCells = document.getElementById("decCells");
      const bitCells = document.getElementById("bitCells");
      const outDec = document.getElementById("outDec");
      const stepUp = document.getElementById("stepUp");
      const stepDown = document.getElementById("stepDown");
      const stepUpBin = document.getElementById("stepUpBin");
      const stepDownBin = document.getElementById("stepDownBin");
      const binMul2 = document.getElementById("binMul2");
      const binDiv2 = document.getElementById("binDiv2");
      const decMul10 = document.getElementById("decMul10");
      const decDiv10 = document.getElementById("decDiv10");
      const btnResetValue = document.getElementById("btnResetValue");
      const btnRandom = document.getElementById("btnRandom");
      const btnAnswer = document.getElementById("btnAnswer");
      const answerReveal = document.getElementById("answerReveal");
      const outBin = document.getElementById("outBin");
      const divmodSection = document.getElementById("divmodSection");
      const divmodEquation = document.getElementById("divmodEquation");
      const outQuotDec = document.getElementById("outQuotDec");
      const outQuotBin = document.getElementById("outQuotBin");
      const outRemDec = document.getElementById("outRemDec");
      const outRemBin = document.getElementById("outRemBin");
      const toggleDivmod = document.getElementById("toggleDivmod");
      const divisorInput = document.getElementById("divisorInput");
      const divmodShiftHint = document.getElementById("divmodShiftHint");
      const logicOpPanel = document.getElementById("logicOpPanel");
      const logicOpOr = document.getElementById("logicOpOr");
      const logicOpAnd = document.getElementById("logicOpAnd");
      const logicOpTypes = document.getElementById("logicOpTypes");
      const btnLogicRandom = document.getElementById("btnLogicRandom");
      const btnLogicReveal = document.getElementById("btnLogicReveal");
      const btnLogicRevealTop = document.getElementById("btnLogicRevealTop");
      const logicAnswerWrap = document.getElementById("logicAnswerWrap");
      const logicAnswerWrapTop = document.getElementById("logicAnswerWrapTop");
      const logicACells = document.getElementById("logicACells");
      const logicBCells = document.getElementById("logicBCells");
      const logicRCells = document.getElementById("logicRCells");
      const rows = [];
      const decInputs = [];
      const decUpBtns = [];
      const decDownBtns = [];
      const bitInputs = [];
      const bitUpBtns = [];
      const bitDownBtns = [];
      const logicAInputs = [];
      const logicBInputs = [];
      const logicRInputs = [];
      const logicAUpBtns = [];
      const logicADownBtns = [];
      const logicBUpBtns = [];
      const logicBDownBtns = [];
      let logicAnswerHidden = false;
      let logicModeHidden = false;
      let padY = 0;

      function syncDecJumpFromN(n) {
        n = Math.max(MIN, Math.min(MAX, Math.round(Number(n))));
        decInputs[0].value = String(Math.floor(n / 100));
        decInputs[1].value = String(Math.floor((n % 100) / 10));
        decInputs[2].value = String(n % 10);
      }

      function readDecJumpAsNum() {
        let h = parseInt(decInputs[0].value, 10);
        let t = parseInt(decInputs[1].value, 10);
        let o = parseInt(decInputs[2].value, 10);
        if (!Number.isFinite(h)) h = 0;
        if (!Number.isFinite(t)) t = 0;
        if (!Number.isFinite(o)) o = 0;
        h = Math.max(0, Math.min(9, h));
        t = Math.max(0, Math.min(9, t));
        o = Math.max(0, Math.min(9, o));
        return Math.max(MIN, Math.min(MAX, h * 100 + t * 10 + o));
      }

      function updateDecJumpButtons() {
        const n = readDecJumpAsNum();
        decUpBtns[0].disabled = n + 100 > MAX;
        decUpBtns[1].disabled = n + 10 > MAX;
        decUpBtns[2].disabled = n + 1 > MAX;
        decDownBtns[0].disabled = n - 100 < MIN;
        decDownBtns[1].disabled = n - 10 < MIN;
        decDownBtns[2].disabled = n - 1 < MIN;
      }

      for (let i = 0; i < 3; i++) {
        const wrap = document.createElement("div");
        wrap.className = "bit-cell";

        const btnUp = document.createElement("button");
        btnUp.type = "button";
        btnUp.className = "bit-step";
        btnUp.textContent = "▲";

        const pow = document.createElement("span");
        pow.className = "bit-pow";
        const exp10 = 2 - i;
        pow.innerHTML = "10<sup>" + exp10 + "</sup>";
        pow.setAttribute("aria-label", "10の" + exp10 + "乗");

        const w = document.createElement("span");
        w.className = "w";
        w.textContent = String(DEC_WEIGHTS[i]);

        const inp = document.createElement("input");
        inp.type = "text";
        inp.className = "bit-in";
        inp.maxLength = 1;
        inp.value = "0";
        inp.setAttribute("inputmode", "numeric");
        inp.setAttribute("aria-label", "10進の桁 " + DEC_WEIGHTS[i]);

        const btnDown = document.createElement("button");
        btnDown.type = "button";
        btnDown.className = "bit-step";
        btnDown.textContent = "▼";

        btnUp.setAttribute("aria-label", "+" + DEC_WEIGHTS[i]);
        btnDown.setAttribute("aria-label", "−" + DEC_WEIGHTS[i]);

        (function (idx) {
          btnUp.addEventListener("click", function () {
            const cur = readDecJumpAsNum();
            setN(Math.min(MAX, cur + DEC_WEIGHTS[idx]));
          });
          btnDown.addEventListener("click", function () {
            const cur = readDecJumpAsNum();
            setN(Math.max(MIN, cur - DEC_WEIGHTS[idx]));
          });
        })(i);

        inp.addEventListener("input", function () {
          const c = this.value.replace(/[^0-9]/g, "").slice(-1);
          this.value = c === "" ? "0" : c;
          updateDecJumpButtons();
        });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            setN(readDecJumpAsNum());
          }
        });

        wrap.appendChild(btnUp);
        wrap.appendChild(w);
        wrap.appendChild(inp);
        wrap.appendChild(pow);
        wrap.appendChild(btnDown);
        decCells.appendChild(wrap);
        decInputs.push(inp);
        decUpBtns.push(btnUp);
        decDownBtns.push(btnDown);
      }

      function updateBinBitButtons() {
        for (let i = 0; i < 8; i++) {
          const is1 = bitInputs[i].value === "1";
          bitUpBtns[i].disabled = is1;
          bitDownBtns[i].disabled = !is1;
          const cell = bitInputs[i].closest(".bit-cell");
          if (cell) {
            cell.classList.toggle("bit-cell--on", is1);
            cell.classList.toggle("bit-cell--off", !is1);
          }
        }
      }

      for (let i = 0; i < 8; i++) {
        const wrap = document.createElement("div");
        wrap.className = "bit-cell";

        const btnUp = document.createElement("button");
        btnUp.type = "button";
        btnUp.className = "bit-step";
        btnUp.textContent = "▲";

        const pow = document.createElement("span");
        pow.className = "bit-pow";
        const exp2 = 7 - i;
        pow.innerHTML = "2<sup>" + exp2 + "</sup>";
        pow.setAttribute("aria-label", "2の" + exp2 + "乗");

        const w = document.createElement("span");
        w.className = "w";
        w.textContent = String(WEIGHTS[i]);

        const inp = document.createElement("input");
        inp.type = "text";
        inp.className = "bit-in";
        inp.maxLength = 1;
        inp.value = "0";
        inp.setAttribute("inputmode", "numeric");
        inp.setAttribute("aria-label", "ビット値 " + WEIGHTS[i]);

        const btnDown = document.createElement("button");
        btnDown.type = "button";
        btnDown.className = "bit-step";
        btnDown.textContent = "▼";

        btnUp.setAttribute("aria-label", WEIGHTS[i] + "の位を1に");
        btnDown.setAttribute("aria-label", WEIGHTS[i] + "の位を0に");

        btnUp.addEventListener("click", function () {
          inp.value = "1";
          updateBinBitButtons();
          setN(readBitsAsNum());
        });
        btnDown.addEventListener("click", function () {
          inp.value = "0";
          updateBinBitButtons();
          setN(readBitsAsNum());
        });

        inp.addEventListener("input", function () {
          const c = this.value.replace(/[^01]/g, "").slice(-1);
          this.value = c === "" ? "0" : c;
          updateBinBitButtons();
        });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            setN(readBitsAsNum());
          }
        });

        wrap.appendChild(btnUp);
        wrap.appendChild(w);
        wrap.appendChild(inp);
        wrap.appendChild(pow);
        wrap.appendChild(btnDown);
        bitCells.appendChild(wrap);
        bitInputs.push(inp);
        bitUpBtns.push(btnUp);
        bitDownBtns.push(btnDown);
      }
      updateBinBitButtons();

      function syncBitsFromN(n) {
        const s = toBin8(n);
        for (let i = 0; i < 8; i++) {
          bitInputs[i].value = s.charAt(i);
        }
      }

      function readBitsAsNum() {
        let s = "";
        for (let i = 0; i < 8; i++) {
          const v = bitInputs[i].value.trim();
          s += v === "1" ? "1" : "0";
        }
        return parseInt(s, 2);
      }

      function syncPadding() {
        const ch = scroller.clientHeight;
        padY = Math.max(0, ch / 2 - ROW_H / 2);
        scroller.style.paddingTop = padY + "px";
        scroller.style.paddingBottom = padY + "px";
      }

      function toBin8(n) {
        return n.toString(2).padStart(8, "0");
      }

      function toBinNatural(n) {
        return n.toString(2);
      }

      function readLogicBits(inputs) {
        let s = "";
        for (let i = 0; i < 8; i++) {
          const v = inputs[i] && inputs[i].value === "1" ? "1" : "0";
          s += v;
        }
        return parseInt(s, 2);
      }

      function syncLogicBitsFromN(inputs, n) {
        const s = toBin8(n);
        for (let i = 0; i < 8; i++) {
          if (inputs[i]) inputs[i].value = s.charAt(i);
        }
      }

      function randomInt(min, max) {
        return min + Math.floor(Math.random() * (max - min + 1));
      }

      function randomizeLogicInputs() {
        const useAnd = logicOpAnd && logicOpAnd.checked;
        const n = useAnd ? randomInt(1, 4) : randomInt(1, 7);
        const lowMask = n >= 8 ? 0xff : (1 << n) - 1;
        const highMask = 0xff ^ lowMask;

        let a = 0;
        let b = 0;
        if (useAnd) {
          // 論理積: B は下位 n ビットだけ 1（それ以外は 0）、A は任意
          do {
            a = randomInt(0, 255);
          } while (a === 0 || a === 255);
          b = lowMask;
        } else {
          // 論理和: A の右 n ビットは 0、B は右 n ビットのみ 0/1 ランダム（それ以外は 0）
          do {
            a = randomInt(0, 255) & highMask;
          } while (a === 0 || a === 255);
          do {
            b = randomInt(0, lowMask);
          } while (b === 0 || b === 255);
        }

        syncLogicBitsFromN(logicAInputs, a);
        syncLogicBitsFromN(logicBInputs, b);
        updateLogicResult();
      }

      function updateLogicBitButtons() {
        for (let i = 0; i < 8; i++) {
          const aIs1 = logicAInputs[i] && logicAInputs[i].value === "1";
          const bIs1 = logicBInputs[i] && logicBInputs[i].value === "1";
          const rIs1 = logicRInputs[i] && logicRInputs[i].value === "1";
          if (logicAUpBtns[i]) logicAUpBtns[i].disabled = !!aIs1;
          if (logicADownBtns[i]) logicADownBtns[i].disabled = !aIs1;
          if (logicBUpBtns[i]) logicBUpBtns[i].disabled = !!bIs1;
          if (logicBDownBtns[i]) logicBDownBtns[i].disabled = !bIs1;
          const aCell = logicAInputs[i] && logicAInputs[i].closest(".bit-cell");
          const bCell = logicBInputs[i] && logicBInputs[i].closest(".bit-cell");
          const rCell = logicRInputs[i] && logicRInputs[i].closest(".bit-cell");
          if (aCell) {
            aCell.classList.toggle("bit-cell--on", !!aIs1);
            aCell.classList.toggle("bit-cell--off", !aIs1);
          }
          if (bCell) {
            bCell.classList.toggle("bit-cell--on", !!bIs1);
            bCell.classList.toggle("bit-cell--off", !bIs1);
          }
          if (rCell) {
            rCell.classList.toggle("bit-cell--on", !!rIs1);
            rCell.classList.toggle("bit-cell--off", !rIs1);
          }
        }
      }

      function updateLogicResult() {
        const a = readLogicBits(logicAInputs);
        const b = readLogicBits(logicBInputs);
        const useAnd = logicOpAnd && logicOpAnd.checked;
        const r = useAnd ? (a & b) : (a | b);
        syncLogicBitsFromN(logicRInputs, r);
        updateLogicBitButtons();
      }

      function setLogicAnswerHidden(hidden) {
        logicAnswerHidden = !!hidden;
        if (logicRCells) {
          const row = logicRCells.closest(".logic-row--result");
          if (row) row.hidden = logicAnswerHidden;
        }
        if (logicAnswerWrap) logicAnswerWrap.hidden = !logicAnswerHidden;
        if (logicAnswerWrapTop) logicAnswerWrapTop.hidden = !logicModeHidden;
      }

      function setLogicModeHidden(hidden) {
        logicModeHidden = !!hidden;
        if (logicOpTypes) logicOpTypes.hidden = logicModeHidden;
        if (logicAnswerWrapTop) logicAnswerWrapTop.hidden = !logicModeHidden;
        if (logicAnswerWrap) logicAnswerWrap.hidden = !logicAnswerHidden;
      }

      function applyTabOrderForBits(upBtns, inputs, downBtns, startTab) {
        let tab = startTab;
        for (let i = 0; i < upBtns.length; i++) {
          if (upBtns[i]) upBtns[i].tabIndex = tab++;
        }
        for (let i = 0; i < inputs.length; i++) {
          if (inputs[i]) inputs[i].tabIndex = tab++;
        }
        for (let i = 0; i < downBtns.length; i++) {
          if (downBtns[i]) downBtns[i].tabIndex = tab++;
        }
        return tab;
      }

      function applyLogicTabOrder(enabled) {
        if (!enabled) {
          const all = []
            .concat(logicAUpBtns, logicADownBtns, logicBUpBtns, logicBDownBtns, logicAInputs, logicBInputs);
          all.forEach(function (el) {
            if (el) el.tabIndex = -1;
          });
          logicRInputs.forEach(function (el) {
            if (el) el.tabIndex = -1;
          });
          return;
        }
        let tab = 1;
        tab = applyTabOrderForBits(logicAUpBtns, logicAInputs, logicADownBtns, tab);
        tab = applyTabOrderForBits(logicBUpBtns, logicBInputs, logicBDownBtns, tab);
        logicRInputs.forEach(function (el) {
          if (el) el.tabIndex = -1;
        });
      }

      function syncLogicModeState() {
        const on =
          document.body.classList.contains("view-hide-dec") &&
          document.body.classList.contains("logic-mode-on");
        document.body.classList.toggle("logic-mode-on", on);
        if (logicOpPanel) logicOpPanel.hidden = !on;
        applyLogicTabOrder(on);
      }

      function buildLogicCells() {
        if (!logicACells || !logicBCells || !logicRCells) return;
        function buildOne(target, inputs, upBtns, downBtns, labelPrefix) {
          target.innerHTML = "";
          for (let i = 0; i < 8; i++) {
            const wrap = document.createElement("div");
            wrap.className = "bit-cell";

            const btnUp = document.createElement("button");
            btnUp.type = "button";
            btnUp.className = "bit-step logic-bit-step";
            btnUp.textContent = "▲";

            const pow = document.createElement("span");
            pow.className = "bit-pow";
            const exp2 = 7 - i;
            pow.innerHTML = "2<sup>" + exp2 + "</sup>";

            const w = document.createElement("span");
            w.className = "w";
            w.textContent = String(WEIGHTS[i]);

            const inp = document.createElement("input");
            inp.type = "text";
            inp.className = "bit-in";
            inp.maxLength = 1;
            inp.value = "0";
            inp.setAttribute("inputmode", "numeric");
            inp.setAttribute("aria-label", labelPrefix + " " + WEIGHTS[i]);

            const btnDown = document.createElement("button");
            btnDown.type = "button";
            btnDown.className = "bit-step logic-bit-step";
            btnDown.textContent = "▼";
            btnUp.setAttribute("aria-label", labelPrefix + " " + WEIGHTS[i] + "の位を1に");
            btnDown.setAttribute("aria-label", labelPrefix + " " + WEIGHTS[i] + "の位を0に");

            btnUp.addEventListener("click", function () {
              inp.value = "1";
              updateLogicResult();
            });
            btnDown.addEventListener("click", function () {
              inp.value = "0";
              updateLogicResult();
            });
            inp.addEventListener("input", function () {
              const c = this.value.replace(/[^01]/g, "").slice(-1);
              this.value = c === "" ? "0" : c;
              updateLogicResult();
            });

            wrap.appendChild(btnUp);
            wrap.appendChild(w);
            wrap.appendChild(inp);
            wrap.appendChild(pow);
            wrap.appendChild(btnDown);
            target.appendChild(wrap);

            inputs.push(inp);
            upBtns.push(btnUp);
            downBtns.push(btnDown);
          }
        }

        function buildResultRow(target, inputs) {
          target.innerHTML = "";
          for (let i = 0; i < 8; i++) {
            const wrap = document.createElement("div");
            wrap.className = "bit-cell bit-cell--off";

            const topSpacer = document.createElement("span");
            topSpacer.className = "logic-bit-spacer";

            const pow = document.createElement("span");
            pow.className = "bit-pow";
            const exp2 = 7 - i;
            pow.innerHTML = "2<sup>" + exp2 + "</sup>";

            const w = document.createElement("span");
            w.className = "w";
            w.textContent = String(WEIGHTS[i]);

            const inp = document.createElement("input");
            inp.type = "text";
            inp.className = "bit-in";
            inp.maxLength = 1;
            inp.value = "0";
            inp.readOnly = true;
            inp.tabIndex = -1;
            inp.setAttribute("aria-label", "結果ビット " + WEIGHTS[i]);

            const bottomSpacer = document.createElement("span");
            bottomSpacer.className = "logic-bit-spacer";

            wrap.appendChild(topSpacer);
            wrap.appendChild(w);
            wrap.appendChild(inp);
            wrap.appendChild(pow);
            wrap.appendChild(bottomSpacer);
            target.appendChild(wrap);
            inputs.push(inp);
          }
        }

        buildOne(logicACells, logicAInputs, logicAUpBtns, logicADownBtns, "Aビット");
        buildOne(logicBCells, logicBInputs, logicBUpBtns, logicBDownBtns, "Bビット");
        buildResultRow(logicRCells, logicRInputs);
      }

      function remainderBinWidth(d) {
        if (d <= 1) return 1;
        return Math.max(1, (d - 1).toString(2).length);
      }

      function toBinRemainderLowerBits(r, d) {
        const w = remainderBinWidth(d);
        return r.toString(2).padStart(w, "0");
      }

      function allowedDivisors() {
        return document.body.classList.contains("view-hide-bin")
          ? [10, 100]
          : [2, 4, 8, 16, 32, 64, 128];
      }

      function syncDivisorSelect() {
        if (!divisorInput) return;
        const allow = allowedDivisors();
        const prev = parseInt(divisorInput.value, 10);
        divisorInput.innerHTML = "";
        for (let i = 0; i < allow.length; i++) {
          const opt = document.createElement("option");
          opt.value = String(allow[i]);
          opt.textContent = String(allow[i]);
          divisorInput.appendChild(opt);
        }
        let pick = allow.indexOf(prev) >= 0 ? prev : allow[0];
        try {
          const dv = localStorage.getItem("decimalBinaryLabDivisor");
          if (dv !== null && dv !== "") {
            const x = parseInt(dv, 10);
            if (Number.isFinite(x) && allow.indexOf(x) >= 0) pick = x;
          }
        } catch (e) {}
        divisorInput.value = String(pick);
        divisorInput.setAttribute(
          "aria-label",
          document.body.classList.contains("view-hide-bin")
            ? "除数（10の累乗）"
            : "除数（2の累乗・2〜128）"
        );
      }

      function readDivisor() {
        const allow = allowedDivisors();
        if (!divisorInput) return allow[0];
        let d = parseInt(divisorInput.value, 10);
        if (!Number.isFinite(d) || allow.indexOf(d) < 0) {
          d = allow[0];
          divisorInput.value = String(d);
        }
        return d;
      }

      function powerOfTwoBitLength(d) {
        if (d < 2) return null;
        const k = Math.log2(d);
        return Number.isInteger(k) ? k : null;
      }

      function powerOfTenExponent(d) {
        if (d < 10) return null;
        const k = Math.log10(d);
        return Number.isInteger(k) && k >= 1 ? k : null;
      }

      function updateShiftHint(d) {
        if (!divmodShiftHint) return;
        if (document.body.classList.contains("view-hide-bin")) {
          const k = powerOfTenExponent(d);
          if (k !== null) {
            divmodShiftHint.innerHTML =
              "（右に<span class=\"divmod-shift-hint-num\">" + k + "</span>桁・10進）";
          } else {
            divmodShiftHint.textContent = "";
          }
        } else {
          const k = powerOfTwoBitLength(d);
          if (k !== null) {
            divmodShiftHint.innerHTML =
              "（右に<span class=\"divmod-shift-hint-num\">" + k + "</span>ビット論理演算）";
          } else {
            divmodShiftHint.textContent = "";
          }
        }
      }

      function updateDivmod() {
        const on = toggleDivmod && toggleDivmod.checked;
        if (divmodSection) divmodSection.hidden = !on;
        if (!on) {
          if (divmodEquation) divmodEquation.textContent = "";
          if (divmodShiftHint) divmodShiftHint.textContent = "";
          return;
        }
        const n = currentN();
        const d = readDivisor();
        updateShiftHint(d);
        const q = Math.floor(n / d);
        const r = n % d;
        if (outQuotDec) outQuotDec.textContent = String(q);
        if (outQuotBin) outQuotBin.textContent = toBinNatural(q);
        if (outRemDec) outRemDec.textContent = String(r);
        if (outRemBin) outRemBin.textContent = toBinRemainderLowerBits(r, d);
        if (divmodEquation) {
          divmodEquation.textContent = n + " ÷ " + d + " = " + q + " … " + r;
        }
      }

      function renderRow(n) {
        const el = document.createElement("div");
        el.className = "row";
        el.dataset.n = String(n);
        el.innerHTML =
          '<span class="d scroll-col scroll-col--dec">' +
          n +
          '</span><span class="b scroll-col scroll-col--bin">' +
          toBinNatural(n) +
          "</span>";
        el.addEventListener("click", function () {
          setN(n);
        });
        return el;
      }

      for (let n = MIN; n <= MAX; n++) {
        const r = renderRow(n);
        scroller.appendChild(r);
        rows.push(r);
      }

      function setHighlight(n) {
        rows.forEach(function (el, i) {
          el.classList.toggle("active", i === n);
        });
      }

      let programScroll = false;

      function clearAnswerReveal() {
        if (!answerReveal) return;
        answerReveal.textContent = "";
        answerReveal.hidden = true;
      }

      function syncAnswerButton() {
        if (!btnAnswer) return;
        const binOnly = document.body.classList.contains("view-hide-dec");
        const decOnly = document.body.classList.contains("view-hide-bin");
        btnAnswer.disabled = !(binOnly || decOnly);
        btnAnswer.title = btnAnswer.disabled
          ? "2進のみ／10進のみの表示のとき使えます"
          : binOnly
            ? "現在の値の10進を表示"
            : "現在の値の2進を表示";
      }

      function applyN(n) {
        clearAnswerReveal();
        n = Math.max(MIN, Math.min(MAX, Math.round(Number(n))));
        outDec.textContent = String(n);
        outBin.textContent = toBinNatural(n);
        syncDecJumpFromN(n);
        syncBitsFromN(n);
        const upDis = n >= MAX;
        const downDis = n <= MIN;
        [stepUp, stepUpBin].forEach(function (b) {
          if (b) b.disabled = upDis;
        });
        [stepDown, stepDownBin].forEach(function (b) {
          if (b) b.disabled = downDis;
        });
        if (binMul2) binMul2.disabled = n * 2 > MAX;
        if (binDiv2) binDiv2.disabled = n <= MIN;
        if (decMul10) decMul10.disabled = n * 10 > MAX;
        if (decDiv10) decDiv10.disabled = n <= MIN;
        updateDecJumpButtons();
        updateBinBitButtons();
        if (btnResetValue) btnResetValue.disabled = n <= MIN;
        setHighlight(n);
        updateDivmod();
        return n;
      }

      function currentN() {
        const x = Number(outDec.textContent);
        return Number.isFinite(x) ? x : 0;
      }

      function setN(n) {
        const v = applyN(n);
        programScroll = true;
        scroller.scrollTop = v * ROW_H;
        requestAnimationFrame(function () {
          programScroll = false;
        });
        return v;
      }

      let scrollTimer;
      scroller.addEventListener("scroll", function () {
        if (programScroll) {
          clearTimeout(scrollTimer);
          return;
        }
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function () {
          if (programScroll) return;
          const cy = scroller.scrollTop + scroller.clientHeight / 2;
          const idx = Math.min(MAX, Math.max(0, Math.floor((cy - padY) / ROW_H)));
          const nFinal = idx;
          applyN(nFinal);
        }, 40);
      });

      function bindStepPair(upBtn, downBtn) {
        if (upBtn) upBtn.addEventListener("click", function () { setN(currentN() + 1); });
        if (downBtn) downBtn.addEventListener("click", function () { setN(currentN() - 1); });
      }
      bindStepPair(stepUp, stepDown);
      bindStepPair(stepUpBin, stepDownBin);
      if (binMul2) {
        binMul2.addEventListener("click", function () {
          const cur = currentN();
          if (cur * 2 <= MAX) setN(cur * 2);
        });
      }
      if (binDiv2) {
        binDiv2.addEventListener("click", function () {
          setN(Math.floor(currentN() / 2));
        });
      }
      if (decMul10) {
        decMul10.addEventListener("click", function () {
          const cur = currentN();
          if (cur * 10 <= MAX) setN(cur * 10);
        });
      }
      if (decDiv10) {
        decDiv10.addEventListener("click", function () {
          setN(Math.floor(currentN() / 10));
        });
      }
      if (btnResetValue) {
        btnResetValue.addEventListener("click", function () {
          setN(MIN);
        });
      }
      if (btnRandom) {
        btnRandom.addEventListener("click", function () {
          setN(MIN + Math.floor(Math.random() * (MAX - MIN + 1)));
        });
      }
      if (toggleDivmod) {
        toggleDivmod.addEventListener("change", function () {
          try {
            localStorage.setItem("decimalBinaryLabDivmod", this.checked ? "1" : "0");
          } catch (e) {}
          updateDivmod();
        });
      }
      if (divisorInput) {
        divisorInput.addEventListener("change", function () {
          readDivisor();
          updateDivmod();
          try {
            localStorage.setItem("decimalBinaryLabDivisor", divisorInput.value);
          } catch (e) {}
        });
      }
      if (logicOpOr) {
        logicOpOr.addEventListener("change", function () {
          if (!this.checked) return;
          try { localStorage.setItem("decimalBinaryLabLogicOp", "or"); } catch (e) {}
          updateLogicResult();
        });
      }
      if (logicOpAnd) {
        logicOpAnd.addEventListener("change", function () {
          if (!this.checked) return;
          try { localStorage.setItem("decimalBinaryLabLogicOp", "and"); } catch (e) {}
          updateLogicResult();
        });
      }
      if (btnLogicRandom) {
        btnLogicRandom.addEventListener("click", function () {
          const pickAnd = Math.random() < 0.5;
          if (logicOpAnd && logicOpOr) {
            logicOpAnd.checked = pickAnd;
            logicOpOr.checked = !pickAnd;
            try { localStorage.setItem("decimalBinaryLabLogicOp", pickAnd ? "and" : "or"); } catch (e) {}
          }
          randomizeLogicInputs();
          if (Math.random() < 0.5) {
            setLogicAnswerHidden(true);
            setLogicModeHidden(false);
          } else {
            setLogicModeHidden(true);
            setLogicAnswerHidden(false);
          }
        });
      }
      if (btnLogicReveal) {
        btnLogicReveal.addEventListener("click", function () {
          setLogicAnswerHidden(false);
          setLogicModeHidden(false);
        });
      }
      if (btnLogicRevealTop) {
        btnLogicRevealTop.addEventListener("click", function () {
          setLogicAnswerHidden(false);
          setLogicModeHidden(false);
        });
      }
      if (btnAnswer && answerReveal) {
        btnAnswer.addEventListener("click", function () {
          if (btnAnswer.disabled) return;
          const n = currentN();
          if (document.body.classList.contains("view-hide-dec")) {
            answerReveal.textContent = String(n);
          } else if (document.body.classList.contains("view-hide-bin")) {
            answerReveal.textContent = toBinNatural(n);
          } else {
            return;
          }
          answerReveal.hidden = false;
        });
      }

      function isArrowNavIgnoredTarget(el) {
        if (!el || !el.tagName) return true;
        const tag = el.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
        if (el.isContentEditable) return true;
        return false;
      }

      document.addEventListener("keydown", function (e) {
        if (isArrowNavIgnoredTarget(e.target)) return;
        const cur = currentN();
        if (e.key === "ArrowUp") {
          e.preventDefault();
          setN(cur + 1);
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          setN(cur - 1);
        } else if (e.key === "PageUp") {
          e.preventDefault();
          setN(cur - 10);
        } else if (e.key === "PageDown") {
          e.preventDefault();
          setN(cur + 10);
        }
      });

      scroller.setAttribute("tabindex", "0");

      window.addEventListener("resize", function () {
        const prev = currentN();
        syncPadding();
        setN(prev);
      });

      function syncListPanelFromToggle() {
        const el = document.getElementById("toggleList");
        const wrap = document.getElementById("listToggleWrap");
        if (!el || !wrap) return;
        const isAll = document.body.classList.contains("view-all");
        el.disabled = !isAll;
        wrap.classList.toggle("view-bar__list--locked", !isAll);
        if (isAll) {
          document.body.classList.toggle("list-hidden", !el.checked);
        } else {
          document.body.classList.remove("list-hidden");
        }
      }

      function syncWeightsFromToggle() {
        const el = document.getElementById("toggleWeights");
        if (!el) return;
        document.body.classList.toggle("hide-weights", !el.checked);
      }

      function applyViewMode(value, persist) {
        document.body.classList.remove("view-hide-dec", "view-hide-bin", "view-all", "logic-mode-on");
        if (value === "hide-dec") {
          document.body.classList.add("view-hide-dec");
        } else if (value === "hide-bin") {
          document.body.classList.add("view-hide-bin");
        } else if (value === "logic") {
          document.body.classList.add("view-hide-dec", "logic-mode-on");
        } else {
          document.body.classList.add("view-all");
        }

        document.querySelectorAll('.view-bar__opts input[name="viewMode"]').forEach(function (radio) {
          const lab = radio.closest("label");
          if (lab) lab.classList.toggle("view-bar__active", radio.checked);
        });
        syncListPanelFromToggle();
        syncAnswerButton();
        clearAnswerReveal();
        if (persist !== false) {
          try {
            localStorage.setItem("decimalBinaryLabView", value);
          } catch (e) {}
        }
        window.dispatchEvent(new Event("resize"));
        syncDivisorSelect();
        updateDivmod();
        syncLogicModeState();
      }

      document.querySelectorAll('input[name="viewMode"]').forEach(function (radio) {
        radio.addEventListener("change", function () {
          if (this.checked) applyViewMode(this.value, true);
        });
      });

      (function initViewAndList() {
        try {
          const listVis = localStorage.getItem("decimalBinaryLabListVisible");
          const tl = document.getElementById("toggleList");
          if (tl) {
            if (listVis === "0") tl.checked = false;
            else tl.checked = true;
          }
        } catch (e) {}

        try {
          const wVis = localStorage.getItem("decimalBinaryLabWeightsVisible");
          const tw = document.getElementById("toggleWeights");
          if (tw) {
            if (wVis === "0") tw.checked = false;
            else tw.checked = true;
          }
        } catch (e) {}
        syncWeightsFromToggle();
        try {
          let dm = localStorage.getItem("decimalBinaryLabDivmod");
          if (dm === null) {
            const dq = localStorage.getItem("decimalBinaryLabDivmodQuot");
            const dr = localStorage.getItem("decimalBinaryLabDivmodRem");
            if (dq === "1" || dr === "1") dm = "1";
          }
          if (toggleDivmod) toggleDivmod.checked = dm === "1";
        } catch (e) {}
        try {
          const lop = localStorage.getItem("decimalBinaryLabLogicOp");
          if (lop === "and" && logicOpAnd) logicOpAnd.checked = true;
          else if (logicOpOr) logicOpOr.checked = true;
        } catch (e) {}

        try {
          const saved = localStorage.getItem("decimalBinaryLabView");
          if (saved === "hide-dec" || saved === "hide-bin" || saved === "logic") {
            const r = document.querySelector('input[name="viewMode"][value="' + saved + '"]');
            if (r) {
              r.checked = true;
              applyViewMode(saved, false);
            } else {
              applyViewMode("all", false);
            }
          } else {
            applyViewMode("all", false);
          }
        } catch (e) {
          applyViewMode("all", false);
        }

        const tl = document.getElementById("toggleList");
        if (tl) {
          tl.addEventListener("change", function () {
            if (this.disabled) return;
            try {
              localStorage.setItem("decimalBinaryLabListVisible", this.checked ? "1" : "0");
            } catch (e) {}
            syncListPanelFromToggle();
            window.dispatchEvent(new Event("resize"));
          });
        }

        const tw = document.getElementById("toggleWeights");
        if (tw) {
          tw.addEventListener("change", function () {
            try {
              localStorage.setItem("decimalBinaryLabWeightsVisible", this.checked ? "1" : "0");
            } catch (e) {}
            syncWeightsFromToggle();
            window.dispatchEvent(new Event("resize"));
          });
        }
      })();

      requestAnimationFrame(function () {
        buildLogicCells();
        syncLogicBitsFromN(logicAInputs, 0);
        syncLogicBitsFromN(logicBInputs, 0);
        updateLogicResult();
        setLogicAnswerHidden(false);
        setLogicModeHidden(false);
        syncPadding();
        syncAnswerButton();
        syncDivisorSelect();
        setN(0);
        updateDivmod();
        syncLogicModeState();
      });
    })();
  </script>
</body>
</html>
