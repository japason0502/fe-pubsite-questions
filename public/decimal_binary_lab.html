<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10進 ↁE2進ラボ！E、E55�E�E/title>
  <style>
    :root {
      --bg: #eef1f6;
      --surface: #ffffff;
      --surface-2: #f4f6fa;
      --border: #d8dde8;
      --text: #141826;
      --muted: #5c6478;
      --accent: #3d5a80;
      --accent-2: #5b7aa1;
      --accent-soft: rgba(61, 90, 128, 0.12);
      --ok: #2d6a4f;
      --row-h: 36px;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 2px 8px rgba(20, 24, 38, 0.06);
      --font: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      --mono: ui-monospace, "Cascadia Code", "Consolas", monospace;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 1.75rem);
      padding-bottom: clamp(5rem, 14vw, 6.5rem);
    }

    /* 表示モーチE 10進まわりを隠ぁE*/
    body.view-hide-dec .view-part-dec,
    body.view-hide-dec .scroll-col--dec {
      display: none !important;
    }
    body.view-hide-dec .scroll-head,
    body.view-hide-dec .row {
      grid-template-columns: 1fr !important;
    }
    /* 表示モーチE 2進まわりを隠ぁE*/
    body.view-hide-bin .view-part-bin,
    body.view-hide-bin .scroll-col--bin {
      display: none !important;
    }
    body.view-hide-bin .scroll-head,
    body.view-hide-bin .row {
      grid-template-columns: 1fr !important;
    }

    /* 10進のみ: 対応一覧は非表示 */
    body.view-hide-bin .view-part-list {
      display: none !important;
    }
    /* 2進のみ: 論理演算オフ�Eとき�E対応一覧パネルごと非表示 */
    body.view-hide-dec:not(.bitwise-side-visible) .view-part-list {
      display: none !important;
    }
    /* すべて表示モードで「対応一覧を表示」オフ�EとぁE*/
    body.view-all.list-hidden .view-part-list {
      display: none !important;
    }

    body.hide-weights .bit-cell .w,
    body.hide-weights .bit-cell .bit-pow {
      display: none !important;
    }

    body.view-hide-dec .step-btns--dec {
      display: none !important;
    }
    body:not(.view-hide-dec) .step-btns--bin {
      display: none !important;
    }
    .num-side--dec-mul {
      display: none !important;
    }
    body.view-hide-bin .num-side--dec-mul {
      display: flex !important;
    }

    .view-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.55rem clamp(0.75rem, 3vw, 1.25rem);
      padding-bottom: calc(0.55rem + env(safe-area-inset-bottom, 0));
      background: var(--surface);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 20px rgba(20, 24, 38, 0.08);
    }
    .view-bar__row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.35rem 0.75rem;
      width: 100%;
    }
    .view-bar__list-label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      border-radius: 8px;
    }
    .view-bar__list--locked .view-bar__list-label--list {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .view-bar__list--locked .view-bar__list-label--list input {
      cursor: not-allowed;
    }
    .view-bar__row.view-bar__list {
      justify-content: space-between;
      gap: 0.75rem 1rem;
    }
    .view-bar__list-trailing {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.35rem 0.75rem;
      margin-left: auto;
    }
    .view-bar__title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-right: 0.25rem;
    }
    .view-bar__opts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.25rem 0.5rem;
    }
    .view-bar label {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 0.35rem 0.55rem;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .view-bar label:hover {
      background: var(--surface-2);
    }
    .view-bar input {
      accent-color: var(--accent);
      width: 1rem;
      height: 1rem;
    }
    .view-bar label.view-bar__active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .page-header {
      margin-bottom: 1.5rem;
    }
    .page-header h1 {
      font-size: clamp(1.15rem, 2.8vw, 1.45rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
      color: var(--text);
    }

    .wrap {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(1rem, 3vw, 1.35rem);
      align-items: start;
    }
    @media (min-width: 880px) {
      .wrap {
        grid-template-columns: minmax(280px, 1fr) minmax(260px, 380px);
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(0.85rem, 2.5vw, 1.15rem);
      box-shadow: var(--shadow);
    }
    .panel--list {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 0.65rem;
    }
    .section-title:not(:first-child) {
      margin-top: 1.35rem;
    }

    .readout-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.65rem;
    }
    .readout-head .section-title {
      margin-bottom: 0;
    }
    .readout-head__btns {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.35rem;
    }
    .btn-tool,
    .btn-reset {
      flex: 0 0 auto;
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 0.38rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn-tool:hover:not(:disabled) {
      border-color: var(--accent-2);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .btn-tool:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }
    .btn-reset:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .btn-reset:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }
    .answer-reveal {
      margin: 0 0 0.65rem;
      padding: 0.45rem 0.65rem;
      font-size: 0.88rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      text-align: center;
    }
    .answer-reveal[hidden] {
      display: none !important;
    }
    body.view-hide-bin .answer-reveal {
      font-family: var(--mono);
    }

    .readout {
      text-align: right;
    }
    @media (max-width: 600px) {
      .readout {
        text-align: center;
      }
      .num-row {
        justify-content: center !important;
      }
      .num-main {
        text-align: center !important;
      }
      .controls {
        justify-content: center !important;
      }
      .controls label {
        justify-content: center !important;
        flex-wrap: wrap;
      }
      .bin-jump-block {
        align-items: center !important;
      }
      .bin-jump-row {
        justify-content: center !important;
      }
      .bit-cells {
        justify-content: center !important;
      }
      .dec-jump-wrap {
        align-items: center !important;
      }
      .digit-cells {
        justify-content: center !important;
      }
      .readout-head {
        justify-content: center;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
    }

    .readout .big {
      font-variant-numeric: tabular-nums;
    }
    .num-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 0.2rem;
      letter-spacing: 0.08em;
    }
    .num-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
    }
    .num-main {
      flex: 1 1 auto;
      min-width: 0;
      text-align: right;
    }
    .num-side {
      flex: 0 0 2.25rem;
      width: 2.25rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* すべて表示: 2進行�E ÁE÷2 列�Eん、E0進行に空きを取り数値の右端を揃える */
    .num-side--readout-spacer {
      display: none;
    }
    body.view-all .num-row.view-part-dec .num-side--readout-spacer {
      display: flex;
      flex: 0 0 2.25rem;
      width: 2.25rem;
      visibility: hidden;
      pointer-events: none;
    }
    .readout .dec {
      font-size: clamp(1.85rem, 7vw, 2.6rem);
      font-weight: 700;
      line-height: 1.1;
      margin: 0;
      color: var(--text);
    }
    .readout .bin {
      font-family: var(--mono);
      font-size: clamp(1.5rem, 5.5vw, 2.45rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      word-break: break-all;
      line-height: 1.15;
      color: var(--accent);
    }
    .step-btns {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .step-btns button {
      width: 2.25rem;
      height: 1.4rem;
      min-height: 36px;
      padding: 0;
      font-size: 0.68rem;
      line-height: 1;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .step-btns button:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .step-btns button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .step-btns--bin-mul button,
    .step-btns--dec-mul button {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: flex-end;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .controls label {
      font-size: 0.86rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.4rem;
      color: var(--text);
    }
    .controls input[type="number"] {
      width: 4.75rem;
      max-width: 100%;
      padding: 0.4rem 0.45rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
    }
    .controls input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .controls--first {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    .bin-jump-block {
      flex-direction: column;
      align-items: flex-end;
      gap: 0.65rem;
      width: 100%;
      border-top: none;
      margin-top: 0;
      padding-top: 0;
    }
    .bin-jump-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: flex-end;
      width: 100%;
    }
    .bit-cells {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 0.4rem;
      width: 100%;
    }
    @media (max-width: 520px) {
      .bit-cells {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.55rem 0.35rem;
        justify-items: center;
      }
    }
    .bit-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
    }
    .bit-step {
      width: 2rem;
      min-height: 32px;
      height: 1.25rem;
      padding: 0;
      font-size: 0.6rem;
      line-height: 1;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .bit-step:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .bit-step:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .bit-pow {
      font-size: 0.62rem;
      line-height: 1.35;
      color: var(--muted);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-align: center;
      max-width: 3.8rem;
      letter-spacing: -0.02em;
    }
    .bit-pow sup {
      font-size: 0.65em;
      font-weight: 600;
      line-height: 0;
      position: relative;
      top: -0.4em;
      color: inherit;
    }
    .bit-cell .w {
      font-size: 0.62rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .bit-in {
      width: 2rem;
      min-width: 44px;
      min-height: 44px;
      height: 2rem;
      padding: 0;
      text-align: center;
      font-size: 1.05rem;
      font-family: var(--mono);
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
    }
    /* 2進ジャンチE 0=OFF 暗く / 1=ON 黁E�� */
    .bit-cell--off .bit-in {
      background: #dfe2ea;
      color: #5c6478;
      border-color: #b8becd;
    }
    .bit-cell--off .bit-in:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .bit-cell--on .bit-in {
      background: linear-gradient(180deg, #fff8e1 0%, #ffecb3 100%);
      color: #6d4c00;
      border-color: #d4a832;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }
    .bit-cell--on .bit-in:focus {
      outline: none;
      border-color: #b8860b;
      box-shadow: 0 0 0 3px rgba(212, 168, 50, 0.28);
    }
    .controls.dec-jump-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.65rem;
      width: 100%;
    }
    .digit-cells {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.5rem;
      width: 100%;
    }
    @media (max-width: 400px) {
      .digit-cells {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        justify-items: center;
      }
    }
    .list-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .list-heading h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }
    .list-heading span {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .scroll-panel {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .scroll-head {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 0.5rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 0.4rem 0.6rem;
      background: var(--surface-2);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
    }
    .scroll-head span:last-child {
      text-align: right;
      font-family: var(--mono);
    }
    #scroller {
      height: min(52vh, 400px);
      min-height: 200px;
      overflow: auto;
      scroll-snap-type: y mandatory;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      -webkit-overflow-scrolling: touch;
    }
    @media (min-width: 880px) {
      #scroller {
        height: min(60vh, 440px);
      }
    }
    .row {
      height: var(--row-h);
      scroll-snap-align: center;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 0.5rem;
      align-items: center;
      padding: 0 0.6rem;
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
      border-bottom: 1px solid #e8ebf2;
      cursor: pointer;
      transition: background 0.12s;
    }
    .row:hover {
      background: var(--surface-2);
    }
    .row .d { text-align: right; font-weight: 500; }
    .row .b {
      font-family: var(--mono);
      text-align: right;
      font-size: 0.74rem;
      letter-spacing: -0.02em;
      color: var(--muted);
    }
    .row.active {
      background: var(--accent-soft);
      font-weight: 600;
    }
    .row.active .b {
      color: var(--text);
    }

    /* 割り算（商・余り�E�E*/
    .divmod-panel {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .divmod-panel[hidden] {
      display: none !important;
    }
    .divmod-divisor-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
      margin-bottom: 0.65rem;
      font-size: 0.82rem;
    }
    .divmod-shift-hint {
      flex: 1 1 auto;
      min-width: 0;
      margin-left: 0.5rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.35;
      text-align: left;
    }
    .divmod-shift-hint-num {
      display: inline-block;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.12em 0.4em 0.15em;
      border-radius: 6px;
      line-height: 1.2;
      vertical-align: baseline;
    }
    .divmod-divisor {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
      color: var(--text);
    }
    .divmod-divisor-op {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .divmod-divisor select {
      min-width: 4.25rem;
      padding: 0.35rem 1.75rem 0.35rem 0.4rem;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .divmod-divisor select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .divmod-equation {
      margin: 0 0 0.65rem;
      font-size: 0.92rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--muted);
      line-height: 1.45;
    }
    /* メインの数値行と同じ右端・列幁E��▲▼2列�Eん�E空き！E*/
    .divmod-align-row {
      margin-bottom: 0;
      align-items: stretch;
    }
    .divmod-align-row .num-main {
      min-width: 0;
    }
    .divmod-align-side {
      visibility: hidden;
      pointer-events: none;
    }
    .divmod-grid {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;

  <script>
    (function () {
      const ROW_H = 36;
      const MIN = 0;
      const MAX = 255;
      const DEC_WEIGHTS = [100, 10, 1];
      const WEIGHTS = [128, 64, 32, 16, 8, 4, 2, 1];
      const scroller = document.getElementById("scroller");
      const decCells = document.getElementById("decCells");

      const btnAnswer = document.getElementById("btnAnswer");
      const answerReveal = document.getElementById("answerReveal");
      const outBin = document.getElementById("outBin");
      const divmodSection = document.getElementById("divmodSection");
      const divmodEquation = document.getElementById("divmodEquation");
      const outQuotDec = document.getElementById("outQuotDec");
      const outQuotBin = document.getElementById("outQuotBin");
      const outRemDec = document.getElementById("outRemDec");
      const outRemBin = document.getElementById("outRemBin");
      const toggleDivmod = document.getElementById("toggleDivmod");
      const toggleBitwise = document.getElementById("toggleBitwise");
      const bitwiseBitsA = document.getElementById("bitwiseBitsA");
      const bitwiseCellsB = document.getElementById("bitwiseCellsB");
      const bitwiseOpSelect = document.getElementById("bitwiseOpSelect");
      const bitwiseBitsRes = document.getElementById("bitwiseBitsRes");
      const bitwiseResLabel = document.getElementById("bitwiseResLabel");
      const divisorInput = document.getElementById("divisorInput");
      const divmodShiftHint = document.getElementById("divmodShiftHint");
      const rows = [];
      const decInputs = [];
      const decUpBtns = [];
      const decDownBtns = [];
      const bitInputs = [];
      const bitUpBtns = [];
      const bitDownBtns = [];
      const bitwiseInputsB = [];
      const bitwiseBUpBtns = [];
      const bitwiseBDownBtns = [];
      let padY = 0;

      function renderBitwiseBitRow(container, bin8) {
        if (!container) return;
        container.innerHTML = "";
        for (let i = 0; i < 8; i++) {
          const ch = bin8.charAt(i) === "1" ? "1" : "0";
          const span = document.createElement("span");
          span.className = "bitwise-bit bitwise-bit--" + ch;
          span.textContent = ch;
          span.setAttribute("aria-label", (i + 1) + "ビット目");
          container.appendChild(span);
        }
      }

      function readBitwiseBNum() {
        let s = "";
        for (let i = 0; i < bitwiseInputsB.length; i++) {
          s += bitwiseInputsB[i].value === "1" ? "1" : "0";
        }
        return parseInt(s, 2);
      }

      function updateBitwiseBBitButtons() {
        for (let i = 0; i < bitwiseInputsB.length; i++) {
          const inp = bitwiseInputsB[i];
          const is1 = inp.value === "1";
          if (bitwiseBUpBtns[i]) bitwiseBUpBtns[i].disabled = is1;
          if (bitwiseBDownBtns[i]) bitwiseBDownBtns[i].disabled = !is1;
          const cell = inp.closest(".bitwise-cell");
          if (cell) {
            cell.classList.toggle("bitwise-cell--on", is1);
            cell.classList.toggle("bitwise-cell--off", !is1);
          }
        }
      }

      function readBitwiseOpMode() {
        if (!bitwiseOpSelect) return "or";
        return bitwiseOpSelect.value === "and" ? "and" : "or";
      }

      function updateBitwisePanel() {
        if (!document.body.classList.contains("view-hide-dec")) return;
        if (!document.body.classList.contains("bitwise-side-visible")) return;
        const a = currentN();
        const b = readBitwiseBNum();
        renderBitwiseBitRow(bitwiseBitsA, toBin8(a));
        const mode = readBitwiseOpMode();
        const res = mode === "and" ? (a & b) & 0xff : (a | b) & 0xff;
        renderBitwiseBitRow(bitwiseBitsRes, toBin8(res));
        if (bitwiseResLabel) {
          bitwiseResLabel.textContent =
            mode === "and" ? "論理積！END・∨�E�E : "論理和！ER・∧�E�E;
        }
        if (bitwiseBitsRes) {
          bitwiseBitsRes.setAttribute(
            "aria-label",
            mode === "and" ? "論理穁EAND ・ ∨ の結果ビッチE : "論理咁EOR ・ ∧ の結果ビッチE
          );
        }
      }

      function syncBitwiseFromToggle() {
        const binOnly = document.body.classList.contains("view-hide-dec");
        const wrap = document.getElementById("listToggleWrap");
        if (toggleBitwise) {
          toggleBitwise.disabled = !binOnly;
        }
        if (wrap) {
          wrap.classList.toggle("view-bar__bitwise--locked", !binOnly);
        }
        if (!binOnly) {
          document.body.classList.remove("bitwise-side-visible");
          window.dispatchEvent(new Event("resize"));
          return;
        }
        if (toggleBitwise && toggleBitwise.checked) {
          document.body.classList.add("bitwise-side-visible");
          updateBitwisePanel();
        } else {
          document.body.classList.remove("bitwise-side-visible");
        }
        window.dispatchEvent(new Event("resize"));
      }

      function syncDecJumpFromN(n) {
        n = Math.max(MIN, Math.min(MAX, Math.round(Number(n))));
        decInputs[0].value = String(Math.floor(n / 100));
        decInputs[1].value = String(Math.floor((n % 100) / 10));
        decInputs[2].value = String(n % 10);
      }

      function readDecJumpAsNum() {
        let h = parseInt(decInputs[0].value, 10);
        let t = parseInt(decInputs[1].value, 10);
        let o = parseInt(decInputs[2].value, 10);
        if (!Number.isFinite(h)) h = 0;
        if (!Number.isFinite(t)) t = 0;
        if (!Number.isFinite(o)) o = 0;
        h = Math.max(0, Math.min(9, h));
        t = Math.max(0, Math.min(9, t));
        o = Math.max(0, Math.min(9, o));
        return Math.max(MIN, Math.min(MAX, h * 100 + t * 10 + o));
      }

      function updateDecJumpButtons() {
        const n = readDecJumpAsNum();
        decUpBtns[0].disabled = n + 100 > MAX;
        decUpBtns[1].disabled = n + 10 > MAX;
        decUpBtns[2].disabled = n + 1 > MAX;
        decDownBtns[0].disabled = n - 100 < MIN;
        decDownBtns[1].disabled = n - 10 < MIN;
        decDownBtns[2].disabled = n - 1 < MIN;
      }

      for (let i = 0; i < 3; i++) {
        const wrap = document.createElement("div");
        wrap.className = "bit-cell";

        const btnUp = document.createElement("button");
        btnUp.type = "button";
        btnUp.className = "bit-step";
        btnUp.textContent = "▲";

        const pow = document.createElement("span");
        pow.className = "bit-pow";
        const exp10 = 2 - i;
        pow.innerHTML = "10<sup>" + exp10 + "</sup>";
        pow.setAttribute("aria-label", "10の" + exp10 + "乁E);

        const w = document.createElement("span");
        w.className = "w";
        w.textContent = String(DEC_WEIGHTS[i]);

        const inp = document.createElement("input");
        inp.type = "text";
        inp.className = "bit-in";
        inp.maxLength = 1;
        inp.value = "0";
        inp.setAttribute("inputmode", "numeric");
        inp.setAttribute("aria-label", "10進の桁E" + DEC_WEIGHTS[i]);

        const btnDown = document.createElement("button");
        btnDown.type = "button";
        btnDown.className = "bit-step";
        btnDown.textContent = "▼";

        btnUp.setAttribute("aria-label", "+" + DEC_WEIGHTS[i]);
        btnDown.setAttribute("aria-label", "∁E + DEC_WEIGHTS[i]);

        (function (idx) {
          btnUp.addEventListener("click", function () {
            const cur = readDecJumpAsNum();
            setN(Math.min(MAX, cur + DEC_WEIGHTS[idx]));
          });
          btnDown.addEventListener("click", function () {
            const cur = readDecJumpAsNum();
            setN(Math.max(MIN, cur - DEC_WEIGHTS[idx]));
          });
        })(i);

        inp.addEventListener("input", function () {
          const c = this.value.replace(/[^0-9]/g, "").slice(-1);
          this.value = c === "" ? "0" : c;
          updateDecJumpButtons();
        });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            setN(readDecJumpAsNum());
          }
        });

        wrap.appendChild(btnUp);
        wrap.appendChild(w);
        wrap.appendChild(inp);
        wrap.appendChild(pow);
        wrap.appendChild(btnDown);
        decCells.appendChild(wrap);
        decInputs.push(inp);
        decUpBtns.push(btnUp);
        decDownBtns.push(btnDown);
      }

      function updateBinBitButtons() {
        for (let i = 0; i < 8; i++) {
          const is1 = bitInputs[i].value === "1";
          bitUpBtns[i].disabled = is1;
          bitDownBtns[i].disabled = !is1;
          const cell = bitInputs[i].closest(".bit-cell");
          if (cell) {
            cell.classList.toggle("bit-cell--on", is1);
            cell.classList.toggle("bit-cell--off", !is1);
          }
        }
      }

      for (let i = 0; i < 8; i++) {
        const wrap = document.createElement("div");
        wrap.className = "bit-cell";

        const btnUp = document.createElement("button");
        btnUp.type = "button";
        btnUp.className = "bit-step";
        btnUp.textContent = "▲";

        const pow = document.createElement("span");
        pow.className = "bit-pow";
        const exp2 = 7 - i;
        pow.innerHTML = "2<sup>" + exp2 + "</sup>";
        pow.setAttribute("aria-label", "2の" + exp2 + "乁E);

        const w = document.createElement("span");
        w.className = "w";
        w.textContent = String(WEIGHTS[i]);

        const inp = document.createElement("input");
        inp.type = "text";
        inp.className = "bit-in";
        inp.maxLength = 1;
        inp.value = "0";
        inp.setAttribute("inputmode", "numeric");
        inp.setAttribute("aria-label", "ビット値 " + WEIGHTS[i]);

        const btnDown = document.createElement("button");
        btnDown.type = "button";
        btnDown.className = "bit-step";
        btnDown.textContent = "▼";

        btnUp.setAttribute("aria-label", WEIGHTS[i] + "の位を1に");
        btnDown.setAttribute("aria-label", WEIGHTS[i] + "の位を0に");

        btnUp.addEventListener("click", function () {
          inp.value = "1";
          updateBinBitButtons();
          setN(readBitsAsNum());
        });
        btnDown.addEventListener("click", function () {
          inp.value = "0";
          updateBinBitButtons();
          setN(readBitsAsNum());
        });

        inp.addEventListener("input", function () {
          const c = this.value.replace(/[^01]/g, "").slice(-1);
          this.value = c === "" ? "0" : c;
          updateBinBitButtons();
        });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            setN(readBitsAsNum());
          }
        });

        wrap.appendChild(btnUp);
        wrap.appendChild(w);
        wrap.appendChild(inp);
        wrap.appendChild(pow);
        wrap.appendChild(btnDown);
        bitCells.appendChild(wrap);
        bitInputs.push(inp);
        bitUpBtns.push(btnUp);
        bitDownBtns.push(btnDown);
      }
      updateBinBitButtons();

      (function initBitwiseBCells() {
        if (!bitwiseCellsB) return;
        for (let i = 0; i < 8; i++) {
          const cell = document.createElement("div");
          cell.className = "bitwise-cell bitwise-cell--off";

          const btnUp = document.createElement("button");
          btnUp.type = "button";
          btnUp.className = "bit-step";
          btnUp.textContent = "▲";
          btnUp.setAttribute("aria-label", "B の佁E" + WEIGHTS[i] + " めEに");

          const inp = document.createElement("input");
          inp.type = "text";
          inp.className = "bitwise-bit-in";
          inp.maxLength = 1;
          inp.value = "0";
          inp.setAttribute("inputmode", "text");
          inp.setAttribute("enterkeyhint", "done");
          inp.setAttribute("aria-label", "B のビッチE" + WEIGHTS[i]);
          inp.addEventListener("input", function () {
            const c = this.value.replace(/[^01]/g, "").slice(-1);
            this.value = c === "" ? "0" : c;
            updateBitwiseBBitButtons();
            updateBitwisePanel();
          });
          inp.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
              e.preventDefault();
              updateBitwisePanel();
            }
          });

          const btnDown = document.createElement("button");
          btnDown.type = "button";
          btnDown.className = "bit-step";
          btnDown.textContent = "▼";
          btnDown.setAttribute("aria-label", "B の佁E" + WEIGHTS[i] + " めEに");

          (function (bitInp) {
            btnUp.addEventListener("click", function () {
              bitInp.value = "1";
              updateBitwiseBBitButtons();
              updateBitwisePanel();
            });
            btnDown.addEventListener("click", function () {
              bitInp.value = "0";
              updateBitwiseBBitButtons();
              updateBitwisePanel();
            });
          })(inp);

          cell.appendChild(btnUp);
          cell.appendChild(inp);
          cell.appendChild(btnDown);
          bitwiseCellsB.appendChild(cell);
          bitwiseInputsB.push(inp);
          bitwiseBUpBtns.push(btnUp);
          bitwiseBDownBtns.push(btnDown);
        }
        updateBitwiseBBitButtons();
      })();

      function syncBitsFromN(n) {
        const s = toBin8(n);
        for (let i = 0; i < 8; i++) {
          bitInputs[i].value = s.charAt(i);
        }
      }

      function readBitsAsNum() {
        let s = "";
        for (let i = 0; i < 8; i++) {
          const v = bitInputs[i].value.trim();
          s += v === "1" ? "1" : "0";
        }
        return parseInt(s, 2);
      }

      function syncPadding() {
        const ch = scroller.clientHeight;
        padY = Math.max(0, ch / 2 - ROW_H / 2);
        scroller.style.paddingTop = padY + "px";
        scroller.style.paddingBottom = padY + "px";
      }

      function toBin8(n) {
        return n.toString(2).padStart(8, "0");
      }

      function toBinNatural(n) {
        return n.toString(2);
      }

      /** 余り [0, d-1] を表す�Eに忁E��なビット数�E�下佁En ビットと揁E��る！E*/
      function remainderBinWidth(d) {
        if (d <= 1) return 1;
        return Math.max(1, (d - 1).toString(2).length);
      }

      function toBinRemainderLowerBits(r, d) {
        const w = remainderBinWidth(d);
        return r.toString(2).padStart(w, "0");
      }

      function allowedDivisors() {
        return document.body.classList.contains("view-hide-bin")
          ? [10, 100]
          : [2, 4, 8, 16, 32, 64, 128];
      }

      function syncDivisorSelect() {
        if (!divisorInput) return;
        const allow = allowedDivisors();
        const prev = parseInt(divisorInput.value, 10);
        divisorInput.innerHTML = "";
        for (let i = 0; i < allow.length; i++) {
          const opt = document.createElement("option");
          opt.value = String(allow[i]);
          opt.textContent = String(allow[i]);
          divisorInput.appendChild(opt);
        }
        let pick = allow.indexOf(prev) >= 0 ? prev : allow[0];
        try {
          const dv = localStorage.getItem("decimalBinaryLabDivisor");
          if (dv !== null && dv !== "") {
            const x = parseInt(dv, 10);
            if (Number.isFinite(x) && allow.indexOf(x) >= 0) pick = x;
          }
        } catch (e) {}
        divisorInput.value = String(pick);
        divisorInput.setAttribute(
          "aria-label",
          document.body.classList.contains("view-hide-bin")
            ? "除数�E�E0の累乗！E
            : "除数�E�Eの累乗�E2、E28�E�E
        );
      }

      function readDivisor() {
        const allow = allowedDivisors();
        if (!divisorInput) return allow[0];
        let d = parseInt(divisorInput.value, 10);
        if (!Number.isFinite(d) || allow.indexOf(d) < 0) {
          d = allow[0];
          divisorInput.value = String(d);
        }
        return d;
      }

      function powerOfTwoBitLength(d) {
        if (d < 2) return null;
        const k = Math.log2(d);
        return Number.isInteger(k) ? k : null;
      }

      function powerOfTenExponent(d) {
        if (d < 10) return null;
        const k = Math.log10(d);
        return Number.isInteger(k) && k >= 1 ? k : null;
      }

      function updateShiftHint(d) {
        if (!divmodShiftHint) return;
        if (document.body.classList.contains("view-hide-bin")) {
          const k = powerOfTenExponent(d);
          if (k !== null) {
            divmodShiftHint.innerHTML =
              "�E�右に<span class=\"divmod-shift-hint-num\">" + k + "</span>桁�E10進�E�E;
          } else {
            divmodShiftHint.textContent = "";
          }
        } else {
          const k = powerOfTwoBitLength(d);
          if (k !== null) {
            divmodShiftHint.innerHTML =
              "�E�右に<span class=\"divmod-shift-hint-num\">" + k + "</span>ビット論理演算！E;
          } else {
            divmodShiftHint.textContent = "";
          }
        }
      }

      function updateDivmod() {
        const on = toggleDivmod && toggleDivmod.checked;
        if (divmodSection) divmodSection.hidden = !on;
        if (!on) {
          if (divmodEquation) divmodEquation.textContent = "";
          if (divmodShiftHint) divmodShiftHint.textContent = "";
          return;
        }
        const n = currentN();
        const d = readDivisor();
        updateShiftHint(d);
        const q = Math.floor(n / d);
        const r = n % d;
        if (outQuotDec) outQuotDec.textContent = String(q);
        if (outQuotBin) outQuotBin.textContent = toBinNatural(q);
        if (outRemDec) outRemDec.textContent = String(r);
        if (outRemBin) outRemBin.textContent = toBinRemainderLowerBits(r, d);
        if (divmodEquation) {
          divmodEquation.textContent = n + " ÷ " + d + " = " + q + " … " + r;
        }
      }

      function renderRow(n) {
        const el = document.createElement("div");
        el.className = "row";
        el.dataset.n = String(n);
        el.innerHTML =
          '<span class="d scroll-col scroll-col--dec">' +
          n +
          '</span><span class="b scroll-col scroll-col--bin">' +
          toBinNatural(n) +
          "</span>";
        el.addEventListener("click", function () {
          setN(n);
        });
        return el;
      }

      for (let n = MIN; n <= MAX; n++) {
        const r = renderRow(n);
        scroller.appendChild(r);
        rows.push(r);
      }

      function setHighlight(n) {
        rows.forEach(function (el, i) {
          el.classList.toggle("active", i === n);
        });
      }

      let programScroll = false;

      function clearAnswerReveal() {
        if (!answerReveal) return;
        answerReveal.textContent = "";
        answerReveal.hidden = true;
      }

      function syncAnswerButton() {
        if (!btnAnswer) return;
        const binOnly = document.body.classList.contains("view-hide-dec");
        const decOnly = document.body.classList.contains("view-hide-bin");
        btnAnswer.disabled = !(binOnly || decOnly);
        btnAnswer.title = btnAnswer.disabled
          ? "2進のみ�E�E0進のみの表示のとき使えまぁE
          : binOnly
            ? "現在の値の10進を表示"
            : "現在の値の2進を表示";
      }

      function applyN(n) {
        clearAnswerReveal();
        n = Math.max(MIN, Math.min(MAX, Math.round(Number(n))));
        outDec.textContent = String(n);
        outBin.textContent = toBinNatural(n);
        syncDecJumpFromN(n);
        syncBitsFromN(n);
        const upDis = n >= MAX;
        const downDis = n <= MIN;
        [stepUp, stepUpBin].forEach(function (b) {
          if (b) b.disabled = upDis;
        });
        [stepDown, stepDownBin].forEach(function (b) {
          if (b) b.disabled = downDis;
        });
        if (binMul2) binMul2.disabled = n * 2 > MAX;
        if (binDiv2) binDiv2.disabled = n <= MIN;
        if (decMul10) decMul10.disabled = n * 10 > MAX;
        if (decDiv10) decDiv10.disabled = n <= MIN;
        updateDecJumpButtons();
        updateBinBitButtons();
        if (btnResetValue) btnResetValue.disabled = n <= MIN;
        setHighlight(n);
        updateDivmod();
        updateBitwisePanel();
        return n;
      }

      function currentN() {
        const x = Number(outDec.textContent);
        return Number.isFinite(x) ? x : 0;
      }

      function setN(n) {
        const v = applyN(n);
        programScroll = true;
        scroller.scrollTop = v * ROW_H;
        requestAnimationFrame(function () {
          programScroll = false;
        });
        return v;
      }

      let scrollTimer;
      scroller.addEventListener("scroll", function () {
        if (programScroll) {
          clearTimeout(scrollTimer);
          return;
        }
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function () {
          if (programScroll) return;
          const cy = scroller.scrollTop + scroller.clientHeight / 2;
          const idx = Math.min(MAX, Math.max(0, Math.floor((cy - padY) / ROW_H)));
          const nFinal = idx;
          applyN(nFinal);
        }, 40);
      });

      function bindStepPair(upBtn, downBtn) {
        if (upBtn) upBtn.addEventListener("click", function () { setN(currentN() + 1); });
        if (downBtn) downBtn.addEventListener("click", function () { setN(currentN() - 1); });
      }
      bindStepPair(stepUp, stepDown);
      bindStepPair(stepUpBin, stepDownBin);
      if (binMul2) {
        binMul2.addEventListener("click", function () {
          const cur = currentN();
          if (cur * 2 <= MAX) setN(cur * 2);
        });
      }
      if (binDiv2) {
        binDiv2.addEventListener("click", function () {
          setN(Math.floor(currentN() / 2));
        });
      }
      if (decMul10) {
        decMul10.addEventListener("click", function () {
          const cur = currentN();
          if (cur * 10 <= MAX) setN(cur * 10);
        });
      }
      if (decDiv10) {
        decDiv10.addEventListener("click", function () {
          setN(Math.floor(currentN() / 10));
        });
      }
      if (btnResetValue) {
        btnResetValue.addEventListener("click", function () {
          setN(MIN);
        });
      }
      if (btnRandom) {
        btnRandom.addEventListener("click", function () {
          setN(MIN + Math.floor(Math.random() * (MAX - MIN + 1)));
        });
      }
      if (toggleDivmod) {
        toggleDivmod.addEventListener("change", function () {
          try {
            localStorage.setItem("decimalBinaryLabDivmod", this.checked ? "1" : "0");
          } catch (e) {}
          updateDivmod();
        });
      }
      if (divisorInput) {
        divisorInput.addEventListener("change", function () {
          readDivisor();
          updateDivmod();
          try {
            localStorage.setItem("decimalBinaryLabDivisor", divisorInput.value);
          } catch (e) {}
        });
      }
      if (btnAnswer && answerReveal) {
        btnAnswer.addEventListener("click", function () {
          if (btnAnswer.disabled) return;
          const n = currentN();
          if (document.body.classList.contains("view-hide-dec")) {
            answerReveal.textContent = String(n);
          } else if (document.body.classList.contains("view-hide-bin")) {
            answerReveal.textContent = toBinNatural(n);
          } else {
            return;
          }
          answerReveal.hidden = false;
        });
      }

      function isArrowNavIgnoredTarget(el) {
        if (!el || !el.tagName) return true;
        const tag = el.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
        if (el.isContentEditable) return true;
        return false;
      }

      document.addEventListener("keydown", function (e) {
        if (isArrowNavIgnoredTarget(e.target)) return;
        const cur = currentN();
        if (e.key === "ArrowUp") {
          e.preventDefault();
          setN(cur + 1);
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          setN(cur - 1);
        } else if (e.key === "PageUp") {
          e.preventDefault();
          setN(cur - 10);
        } else if (e.key === "PageDown") {
          e.preventDefault();
          setN(cur + 10);
        }
      });

      scroller.setAttribute("tabindex", "0");

      window.addEventListener("resize", function () {
        const prev = currentN();
        syncPadding();
        setN(prev);
      });

      function syncListPanelFromToggle() {
        const el = document.getElementById("toggleList");
        const wrap = document.getElementById("listToggleWrap");
        if (!el || !wrap) return;
        const isAll = document.body.classList.contains("view-all");
        el.disabled = !isAll;
        wrap.classList.toggle("view-bar__list--locked", !isAll);
        if (isAll) {
          document.body.classList.toggle("list-hidden", !el.checked);
        } else {
          document.body.classList.remove("list-hidden");
        }
      }

      function syncWeightsFromToggle() {
        const el = document.getElementById("toggleWeights");
        if (!el) return;
        document.body.classList.toggle("hide-weights", !el.checked);
      }

      function applyViewMode(value, persist) {
        document.body.classList.remove("view-hide-dec", "view-hide-bin", "view-all");
        if (value === "hide-dec") document.body.classList.add("view-hide-dec");
        else if (value === "hide-bin") document.body.classList.add("view-hide-bin");
        else document.body.classList.add("view-all");

        document.querySelectorAll('.view-bar__opts input[name="viewMode"]').forEach(function (radio) {
          const lab = radio.closest("label");
          if (lab) lab.classList.toggle("view-bar__active", radio.checked);
        });
        syncListPanelFromToggle();
        syncAnswerButton();
        clearAnswerReveal();
        if (persist !== false) {
          try {
            localStorage.setItem("decimalBinaryLabView", value);
          } catch (e) {}
        }
        window.dispatchEvent(new Event("resize"));
        syncDivisorSelect();
        updateDivmod();
        syncBitwiseFromToggle();
      }

      document.querySelectorAll('input[name="viewMode"]').forEach(function (radio) {
        radio.addEventListener("change", function () {
          if (this.checked) applyViewMode(this.value, true);
        });
      });

      (function initViewAndList() {
        try {
          const listVis = localStorage.getItem("decimalBinaryLabListVisible");
          const tl = document.getElementById("toggleList");
          if (tl) {
            if (listVis === "0") tl.checked = false;
            else tl.checked = true;
          }
        } catch (e) {}

        try {
          const wVis = localStorage.getItem("decimalBinaryLabWeightsVisible");
          const tw = document.getElementById("toggleWeights");
          if (tw) {
            if (wVis === "0") tw.checked = false;
            else tw.checked = true;
          }
        } catch (e) {}
        syncWeightsFromToggle();

        try {
          let dm = localStorage.getItem("decimalBinaryLabDivmod");
          if (dm === null) {
            const dq = localStorage.getItem("decimalBinaryLabDivmodQuot");
            const dr = localStorage.getItem("decimalBinaryLabDivmodRem");
            if (dq === "1" || dr === "1") dm = "1";
          }
          if (toggleDivmod) {
            toggleDivmod.checked = dm === "1";
          }
        } catch (e) {}

        try {
          const bw = localStorage.getItem("decimalBinaryLabBitwise");
          if (toggleBitwise && bw === "1") toggleBitwise.checked = true;
        } catch (e) {}

        try {
          const op = localStorage.getItem("decimalBinaryLabBitwiseOp");
          if (bitwiseOpSelect && (op === "or" || op === "and")) {
            bitwiseOpSelect.value = op;
          }
        } catch (e) {}

        try {
          const saved = localStorage.getItem("decimalBinaryLabView");
          if (saved === "hide-dec" || saved === "hide-bin") {
            const r = document.querySelector('input[name="viewMode"][value="' + saved + '"]');
            if (r) {
              r.checked = true;
              applyViewMode(saved, false);
            } else {
              applyViewMode("all", false);
            }
          } else {
            applyViewMode("all", false);
          }
        } catch (e) {
          applyViewMode("all", false);
        }

        const tl = document.getElementById("toggleList");
        if (tl) {
          tl.addEventListener("change", function () {
            if (this.disabled) return;
            try {
              localStorage.setItem("decimalBinaryLabListVisible", this.checked ? "1" : "0");
            } catch (e) {}
            syncListPanelFromToggle();
            window.dispatchEvent(new Event("resize"));
          });
        }

        const tw = document.getElementById("toggleWeights");
        if (tw) {
          tw.addEventListener("change", function () {
            try {
              localStorage.setItem("decimalBinaryLabWeightsVisible", this.checked ? "1" : "0");
            } catch (e) {}
            syncWeightsFromToggle();
            window.dispatchEvent(new Event("resize"));
          });
        }

        if (toggleBitwise) {
          toggleBitwise.addEventListener("change", function () {
            if (this.disabled) return;
            try {
              localStorage.setItem("decimalBinaryLabBitwise", this.checked ? "1" : "0");
            } catch (e) {}
            syncBitwiseFromToggle();
          });
        }

        if (bitwiseOpSelect) {
          bitwiseOpSelect.addEventListener("change", function () {
            try {
              localStorage.setItem("decimalBinaryLabBitwiseOp", this.value);
            } catch (e) {}
            updateBitwisePanel();
          });
        }
      })();

      requestAnimationFrame(function () {
        syncPadding();
        syncAnswerButton();
        setN(0);
        updateDivmod();
        syncBitwiseFromToggle();
      });
    })();
  </script>
</body>
</html>
