name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      # SITE_PATHS_LEGACY はビルドにも渡す（ROOT_IS_TRIAL=false の間だけ、vite.config.ts が1個目をお知らせ用に埋め込む）
      - run: npm run build
        env:
          SITE_PATHS_LEGACY: ${{ secrets.SITE_PATHS_LEGACY }}

      # 同じ index.html を複数のパスに置く（SPAはパスと <meta name="fe-edition"> で版を判定する）。
      #   /trial/                     … 体験版（テスト用、秘密ではない）
      #   SITE_PATHS_LEGACY のパス    … フル版。無料で配った人向け＋これまでのKindle本に載せたURL
      #   SITE_PATHS_COURSE のパス    … フル版。本講座（有料）の購入者向け
      #   SITE_PATHS_KINDLE のパス    … Kindle版。新しい版のKindle本に載せるURL
      # どれもカンマ区切りで複数書ける。パスの値は JS に入れない（ここでフォルダを作るだけ）。
      - name: Copy entry pages (trial / legacy / course / kindle)
        env:
          SITE_PATHS_LEGACY: ${{ secrets.SITE_PATHS_LEGACY }}
          SITE_PATHS_COURSE: ${{ secrets.SITE_PATHS_COURSE }}
          SITE_PATHS_KINDLE: ${{ secrets.SITE_PATHS_KINDLE }}
        run: |
          place() { # $1=パス $2=版
            p="${1#/}"; p="${p%/}"
            [ -z "$p" ] && return
            mkdir -p "dist/$p"
            sed "s#<head>#<head><meta name=\"fe-edition\" content=\"$2\">#" dist/index.html > "dist/$p/index.html"
          }
          place trial trial
          for p in $(echo "$SITE_PATHS_LEGACY" | tr ',' ' '); do place "$p" full; done
          for p in $(echo "$SITE_PATHS_COURSE" | tr ',' ' '); do place "$p" full; done
          for p in $(echo "$SITE_PATHS_KINDLE" | tr ',' ' '); do place "$p" kindle; done
          # 登録漏れに気づけるようにログに件数だけ出す（パスの値は出さない）
          echo "legacy=$(echo "$SITE_PATHS_LEGACY" | tr ',' '\n' | grep -c .) course=$(echo "$SITE_PATHS_COURSE" | tr ',' '\n' | grep -c .) kindle=$(echo "$SITE_PATHS_KINDLE" | tr ',' '\n' | grep -c .)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
